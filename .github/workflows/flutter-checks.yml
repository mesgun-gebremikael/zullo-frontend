name: Flutter checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.4'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --reporter expanded
      - run: python3 .ci/check_analysis.py
      - run: python3 .ci/check_ios_setup.py
      - run: flutter build web --release --dart-define=ZULLO_API_URL=https://api.example.invalid
  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.4'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug --no-codesign --dart-define-from-file=config/ios.firebase.json --dart-define=ZULLO_API_URL=https://api.example.invalid
      - run: git diff --exit-code -- ios/Podfile.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-dependency-lock
          path: ios/Podfile.lock
          if-no-files-found: ignore
