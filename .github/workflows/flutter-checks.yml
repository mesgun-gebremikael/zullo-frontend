name: Flutter checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node24)
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.4'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --reporter expanded
      - run: python3 .ci/check_localizations.py
      - run: python3 .ci/check_analysis.py
      - run: python3 .ci/check_ios_setup.py
      - run: python3 .ci/check_android_setup.py
      - run: python3 .ci/check_geolocator_patch.py
      - run: python3 tool/generate_notification_resources.py --check
      - run: flutter build web --release --dart-define=ZULLO_API_URL=https://api.example.invalid
  ios-build:
    # Pin the standard Intel image; macos-15 now aliases arm64 and exhausted
    # hosted capacity before assigning a runner in run45831841893.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node24)
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.4'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      # Maintainers may explicitly request a native dependency refresh in a PR.
      # Only the disposable runner copy is unlocked; the resulting artifact must
      # be reviewed and committed before the normal reproducibility check passes.
      - name: Refresh native lock for an explicitly labelled dependency update
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'refresh-ios-dependencies')
        run: rm ios/Podfile.lock
      # Resolve dependencies first; upload a changed native lockfile for review
      # before spending time on a full Xcode build.
      - run: flutter build ios --simulator --debug --no-codesign --config-only --dart-define-from-file=config/ios.firebase.json --dart-define=ZULLO_API_URL=https://api.example.invalid
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node24)
        if: always()
        with:
          name: ios-dependency-lock
          path: ios/Podfile.lock
          if-no-files-found: ignore
      - run: plutil -lint ios/Runner/*.lproj/Localizable.strings ios/Runner.xcodeproj/project.pbxproj
      - run: git ls-files --error-unmatch ios/Podfile.lock && git diff --exit-code -- ios/Podfile.lock
      - run: flutter build ios --simulator --debug --no-codesign --dart-define-from-file=config/ios.firebase.json --dart-define=ZULLO_API_URL=https://api.example.invalid
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node24)
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.4'
          channel: stable
      - run: flutter config --jdk-dir="$JAVA_HOME_17_X64"
      - run: flutter pub get --enforce-lockfile
      # Flutter generates the ignored Gradle wrapper and local.properties first.
      - run: flutter build apk --debug --dart-define=ZULLO_API_URL=https://api.example.invalid
      - run: JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew :geolocator_android:testDebugUnitTest
        working-directory: android
      - name: Preserve failed native test diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node24)
        with:
          name: android-native-test-diagnostics
          path: |
            build/geolocator_android/test-results/testDebugUnitTest
            build/geolocator_android/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
      - name: Verify release signing with a disposable CI key
        run: JAVA_HOME="$JAVA_HOME_17_X64" python3 .ci/check_android_release_signing.py
